<!DOCTYPE html>
<html>
    <head>
        <script type="module" src="js/app.js"></script>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>
                EDA Live Viewer
            </h1>
        </header>
        <main>
            <div id="container">
                <div id="stimControlContainer">
                    <div id="stimControl">
                        <div id="stimGenerator">
                            <select id="stimTypeSelector">
                                <option value="">-- Choose an type --</option>
                            </select>
                            <select id="stimValueShapeSelector">
                                <option value="">-- Choose an shape --</option>
                            </select>
                            <select id="stimValueColorSelector">
                                <option value="">-- Choose an color --</option>
                            </select>
                        </div>
                        <button id="stimStartToggleButton">
                            Start
                        </button>
                    </div>
                    <button id="stimControlToggleButton">&#9664;</button>
                </div>
                <div id="stimDisplayContainerWrapper">
                    <div id="stimDisplayContainer">
                        <div id="stimDisplay"></div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
