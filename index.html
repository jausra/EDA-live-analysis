                                        </div>
                                        <div class="calibration-panel__right">
                                            <input type="text" class="calibration-panel__input" id="offset-input" placeholder="Enter offset">
                                        </div>
                                    </div>

                                    <div class="bottom-button" id="offset-recenter">Re-center</div>
                                </div>
