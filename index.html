<!DOCTYPE html>
<html>
    <head>
        <script type="module" src="js/app.js"></script>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>
                EDA Live Viewer
            </h1>
        </header>
        <main>
            <div id="container">
                <div id="stimControlContainer">
                    <div id="stimControl">
                        <div id="stimPanel">
                            <div id="stimGenerator">
                                <select id="stimTypeSelector">
                                    <option value="">--Choose a type--</option>
                                </select>
                                <select id="stimValueShapeSelector" class="hidden">
                                    <option value="">--Choose a shape--</option>
                                </select>
                                <select id="stimValueColorSelector" class="hidden">
                                    <option value="">--Choose a color--</option>
                                </select>
                                <input type="text" id="stimValueWordInput" placeholder="Enter a word" class="hidden">
                                <select id="stimRatioSelector">
                                    <option value="">--Choose a ratio--</option>
                                </select>
                                <select id="stimTimeSelector">
                                    <option value="">--Choose a time--</option>
                                </select>
                                <button id="addStimButton" class="hidden">+</button>
                            </div>
                            <div id="stimItemContainer"></div>
                        </div>
                        <button id="stimStartToggleButton">
                            Start
                        </button>
                    </div>
                    <button id="stimControlToggleButton">&#9664;</button>
                </div>
                <div id="stimDisplayContainerWrapper">
                    <div id="stimDisplayContainer">
                        <div id="stimDisplay"></div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
