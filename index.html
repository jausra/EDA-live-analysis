<!DOCTYPE html>
<html>
    <head>
        <script type="module" src="js/app.js"></script>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js" integrity="sha512-UXumZrZNiOwnTcZSHLOfcTs0aos2MzBWHXOHOuB0J/R44QB0dwY5JgfbvljXcklVf65Gc4El6RjZ+lnwd2az2g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.2.0/chartjs-plugin-zoom.min.js" integrity="sha512-FRGbE3pigbYamZnw4+uT4t63+QJOfg4MXSgzPn2t8AWg9ofmFvZ/0Z37ZpCawjfXLBSVX2p2CncsmUH2hzsgJg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    </head>
    <body>
        <header>
            <h1>
                EDA Live Viewer
            </h1>
        </header>
        <main>
            <div id="container">
                <div id="leftModal">
                    <div id="stimControl">
                        <div id="stimPanel">
                            <div id="connContainer">
                                <div id="connBox1" class="connBox">+</div>
                                <div id="connBox2" class="connBox">+</div>
                            </div>
                            <div id="gameContainer">
                                <div id="debugGameButton" class="gameButton disabled"> Debug</div>
                                <div id="breathingGameButton" class="gameButton disabled"> Breathing Game</div>
                                <div id="redDotGameButton" class="gameButton disabled"> Red Dot Game</div>
                                <div id="customGameButton" class="gameButton disabled"> Custom Game</div>
                                <!-- <div id="xGameButton" class="gameButton"> x Game</div>
                                <div id="xxGameButton" class="gameButton"> xx Game</div>
                                <div id="xxxGameButton" class="gameButton"> xxx Game</div>
                                <div id="xxxxGameButton" class="gameButton"> xxxx Game</div> -->
                            </div>
                            <div id="gameTitleContainer" class="hiddenFlex">
                                <button id="backButton">Back</button>
                                <div id="gameTitleSpacer">
                                    <div id="gameTitle"></div>
                                </div>
                            </div>
                            <div id="stimGenAndRand" class="hiddenFlex">
                                <button id="stimRandomizerButton">Random: ON</button>
                                <div id="stimGenerator" class="hidden">
                                    <select id="stimTypeSelector">
                                        <option value="">--Choose a type--</option>
                                    </select>
                                    <select id="stimValueShapeSelector" class="hidden">
                                        <option value="">--Choose a shape--</option>
                                    </select>
                                    <select id="stimValueColorSelector" class="hidden">
                                        <option value="">--Choose a color--</option>
                                    </select>
                                    <input type="text" id="stimValueWordInput" placeholder="Enter a word" class="hidden">
                                    <select id="stimRatioSelector">
                                        <option value="">--Choose a ratio--</option>
                                    </select>
                                    <select id="stimTimeSelector">
                                        <option value="">--Choose a time--</option>
                                    </select>
                                    <button id="addStimButton" class="hidden">+</button>
                                </div>
                            </div>
                            <div id="stimItemContainer"></div>
                        </div>
                        <div id="displayControlButtons">
                            <button id="calibrateButton" class="hiddenFlex" disabled>
                                Calibrate
                            </button>
                            <button id="stimStartStopButton" class="hiddenFlex" disabled>
                                Start
                            </button>
                            <button id="stimPauseResumeButton" class="hiddenFlex" disabled>
                                Pause
                            </button>
                            <button id="saveDataButton" class="hiddenFlex" disabled>
                                Save
                            </button>
                        </div>
                    </div>
                    <button id="leftModalButton">&#9664;</button>
                </div>
                <div id="centralModalWrapper">
                    <div id="stimDisplayContainer">
                        <div id="calContainer" class="hiddenFlex">
                            <div id="calDisplay">
                                <div class="horFlex">
                                    <p class="calTitle">Offset Resistance:</p>
                                    <div class="calInput">
                                        <input type="text" id="calOffsetInput">
                                        <span class="calInputUnit">kΩ</span>
                                    </div>
                                </div>
                                <input type="range" class="calSlider" id="calOffsetSlider">
                                <div class="horFlex">
                                    <p class="calTitle">Gain Resistance:</p>
                                    <div class="calInput">
                                        <input type="text" id="calGainInput">
                                        <span class="calInputUnit">kΩ</span>
                                    </div>
                                </div>
                                <input type="range" class="calSlider" id="calGainSlider">
                                <button id="calSubmitButton">Submit</button>
                                <button id="calStartButton">Start</button>
                            </div>
                        </div>
                        <div id="stimDisplay"></div>
                        <canvas id="stimRadialGauge" width="500" height="500"></canvas>
                    </div>
                </div>
                <div id="rightModal" class="collapsed">
                    <div id="result">
                        <div id="serialChartContainer">
                            <canvas id="serialChart" width="500px"></canvas>
                        </div>
                        <button id="resetZoomButton">Reset Zoom</button>
                        <div id="sigChartContainer">
                            <!-- <canvas id="sigBarChart"></canvas> -->
                            <canvas id="sigLineChart"></canvas>
                        </div>
                        <div class="sigHorFlex">
                            <p class="sigParam">Significance Window (Rounds):</p>
                            <p class="sigParam" id="sigLineWindowText"></p>
                        </div>
                        <input type="range" class="sigSlider" id="sigLineWindowSlider">
                        <div class="sigHorFlex">
                            <p class="sigParam">Significance Overlap:</p>
                            <p class="sigParam" id="sigLineOverlapText"></p>
                        </div>
                        <input type="range" class="sigSlider" id="sigLineOverlapSlider">
                        <button id="sigLineSubmitButton">Submit</button>
                    </div>
                    <button id="rightModalButton">&#9664;</button>
                </div>
            </div>
        </main>
    </body>
</html>
